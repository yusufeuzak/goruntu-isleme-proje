<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goruntu Isleme Projesi</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Goruntu Isleme Web Araci</h1>

    <div id="dropzone" class="dropzone">
      <p class="dropzone-text">Gorseli surukleyip birakin veya dosya secin (yalnizca JPG/PNG)</p>
      <input id="fileInput" class="file-input" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" />
      <p id="uploadMessage" class="message"></p>
    </div>

    <div class="content-grid">
      <section class="card image-panel">
        <h3>Yuklenen Gorsel</h3>
        <div id="imageViewport" class="image-viewport">
          <img id="previewImage" alt="Yuklenen goruntu" draggable="false" />
          <div id="cropSelection" class="crop-selection"></div>
        </div>
        <div class="image-actions">
          <button id="removeImageBtn" type="button">Gorseli Kaldir</button>
        </div>
      </section>

      <section class="card ops-panel">
        <h3>Islem Menusu</h3>
        <label class="op-item">
          <input type="checkbox" class="op-checkbox" value="grayscale" />
          <span>Gri Donusum</span>
        </label>
        <label class="op-item">
          <input type="checkbox" class="op-checkbox" value="binary" />
          <span>Binary Donusum</span>
        </label>
        <p class="angle-label">Goruntu Kirpma (Fare ile Secim)</p>
        <p class="crop-help">Gorsel ustunde fare ile dikdortgen secip alttaki butona basin.</p>
        <div class="crop-actions">
          <button id="startCropBtn" type="button">Kirpmaya Basla</button>
          <button id="applySelectionCropBtn" type="button" disabled>Secili Alani Kirp</button>
        </div>
        <p class="angle-label">Goruntu Dondurme</p>
        <div class="rotate-options">
          <label for="rotateAngle" class="angle-label">Aci</label>
          <input type="range" id="rotateAngle" min="0" max="360" value="0" />
          <span id="angleVal">0°</span>
        </div>

        <div class="op-actions">
          <button id="applySelectedOpsBtn" type="button">Secili Islemleri Uygula</button>
          <button id="clearSelectedOpsBtn" type="button">Secili Islemleri Temizle</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
